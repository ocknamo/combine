<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>viewport probe</title>
<!--
  ソフトキーボードの実機挙動を測るための開発用ページ。combine 本体には含まれない
  （`public/` ではなくリポジトリ直下に置いてあるので dev サーバでしか配られない）。

  `npm run dev -- --host` して、スマホから /viewport-probe.html を開く。
  下の編集領域をタップしてキーボードを出し、上の数字とイベント数を読む。

  combine の compose 画面と同じ骨格を再現してある: 100dvh の縦 flex、sticky の
  ヘッダとタブバー、余りを埋める host box、その中の shadow root、shadow の中の
  `[data-post-editor-root]` と下端に貼り付いたフッタ（eHagaki の投稿ボタン相当）。
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; font: 13px/1.5 system-ui, sans-serif; }
  .app { display: flex; flex-direction: column; min-height: 100dvh; max-width: 640px; margin: 0 auto; }
  header { position: sticky; top: 0; background: #e6e2d4; padding: .5rem; z-index: 10; }
  nav { position: sticky; bottom: 0; background: #e6e2d4; padding: .75rem; text-align: center; z-index: 10; }
  main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  /* combine の `.composer` と同じ: flex の余り、min-height 0、overflow hidden */
  #host { flex: 1; min-height: 0; overflow: hidden; }
  #out { position: fixed; top: 2.2rem; left: 0; right: 0; z-index: 100; margin: 0 auto; max-width: 640px;
         background: rgba(0,0,0,.82); color: #ffe; padding: .4rem .6rem; font: 11px/1.35 ui-monospace, monospace;
         white-space: pre; overflow-x: auto; }
  #modes { position: fixed; top: 0; left: 0; right: 0; z-index: 101; display: flex; gap: .25rem; padding: .25rem;
           background: #fdfdfa; max-width: 640px; margin: 0 auto; }
  #modes button { flex: 1; font: 11px system-ui; padding: .3rem 0; }
  #modes button[aria-pressed="true"] { background: #a08433; color: #fff; }
</style>
</head>
<body>
<div class="app">
  <header>header (sticky)</header>
  <main><div id="host"></div></main>
  <nav>tab bar (sticky)</nav>
</div>

<div id="modes">
  <button data-mode="none" aria-pressed="false">何もしない</button>
  <button data-mode="flow" aria-pressed="true">flow (修正前)</button>
  <button data-mode="pinned" aria-pressed="false">pinned (修正後)</button>
</div>
<pre id="out"></pre>

<script type="module">
// ---- eHagaki 相当のダミー要素。shadow root の中に編集領域とフッタを持つ ----
class ProbeEditor extends HTMLElement {
  connectedCallback() {
    const root = this.attachShadow({ mode: 'open' });
    root.innerHTML = `
      <style>
        :host { display: block; }            /* 実物と同じ */
        .shell { position: relative; height: 100%; background: #f6f4ec; }
        .body { padding: .5rem; height: 100%; overflow: auto; }
        [contenteditable] { min-height: 6rem; border: 1px solid #ccc; background: #fff; padding: .5rem; }
        .footer { position: absolute; left: 0; right: 0; bottom: 0; height: 56px; background: #a08433;
                  color: #fff; display: flex; align-items: center; justify-content: center; font: 14px system-ui; }
      </style>
      <div class="shell">
        <div class="body" data-post-editor-root>
          <p>ここをタップしてキーボードを出す ↓</p>
          <div contenteditable="true">本文</div>
        </div>
        <div class="footer">投稿ボタン（見えていれば OK）</div>
      </div>`;
  }
}
customElements.define('probe-editor', ProbeEditor);

const host = document.getElementById('host');
const el = document.createElement('probe-editor');
host.appendChild(el);

// ---- 修正前の composerHeight ----
const MIN = 240;
const oldHeight = ({ hostTop, hostHeight, viewport }) => {
  const visible = viewport ? viewport.offsetTop + viewport.height - hostTop : hostHeight;
  return Math.max(Math.min(hostHeight, visible), MIN);
};
// ---- 修正後の composerBox ----
const KEYBOARD_THRESHOLD = 120;
const newBox = ({ host: h, viewport, layoutHeight }) => {
  if (viewport && viewport.scale <= 1.05 && layoutHeight - viewport.height > KEYBOARD_THRESHOLD) {
    return { mode: 'pinned', top: viewport.offsetTop, left: h.left, width: h.width, height: viewport.height };
  }
  const visible = viewport ? viewport.offsetTop + viewport.height - h.top : h.height;
  return { mode: 'flow', height: Math.max(Math.min(h.height, visible), MIN) };
};

// ---- 上流 eHagaki の F6()（フォーカスがエディタ内かの判定）をそのまま再現 ----
const TM = '[data-post-editor-root]';
function f6() {
  const e = document.activeElement;
  if (e?.closest(TM)) return true;
  if (e && e !== document.body && e !== document.documentElement) return false;
  const s = document.getSelection();
  const n = s?.anchorNode;
  const anchor = n instanceof Element ? n : n?.parentElement ?? null;
  return !!(s?.rangeCount && anchor?.closest(TM));
}

let mode = 'flow';
const counts = { vvResize: 0, vvScroll: 0, winScroll: 0, ro: 0 };

function apply() {
  const rect = host.getBoundingClientRect();
  const vv = window.visualViewport;
  const viewport = vv ? { offsetTop: vv.offsetTop, height: vv.height, scale: vv.scale } : null;
  const layoutHeight = document.documentElement.clientHeight;
  const s = el.style;

  if (mode === 'none') {
    s.cssText = `height:${rect.height}px`;              // 最初の高さのまま固定
  } else if (mode === 'flow') {
    s.cssText = `height:${oldHeight({ hostTop: rect.top, hostHeight: rect.height, viewport })}px`;
  } else {
    const box = newBox({ host: rect, viewport, layoutHeight });
    s.cssText = box.mode === 'pinned'
      ? `position:fixed;top:${box.top}px;left:${box.left}px;width:${box.width}px;height:${box.height}px;z-index:20`
      : `height:${box.height}px`;
  }

  const er = el.getBoundingClientRect();
  const visBottom = viewport ? viewport.offsetTop + viewport.height : layoutHeight;
  const shadowActive = el.shadowRoot?.activeElement;
  document.getElementById('out').textContent = [
    `mode=${mode}  適用=${s.cssText}`,
    `layout(clientHeight)=${layoutHeight}  innerHeight=${window.innerHeight}  scrollY=${Math.round(window.scrollY)}`,
    `visualViewport height=${vv ? Math.round(vv.height) : '-'} offsetTop=${vv ? Math.round(vv.offsetTop) : '-'} scale=${vv ? vv.scale.toFixed(2) : '-'}`,
    `キーボード推定 = ${vv ? Math.round(layoutHeight - vv.height) : '-'} px`,
    `host box   top=${Math.round(rect.top)} bottom=${Math.round(rect.bottom)} height=${Math.round(rect.height)}`,
    `要素        top=${Math.round(er.top)} bottom=${Math.round(er.bottom)} height=${Math.round(er.height)}`,
    `可視領域の下端=${Math.round(visBottom)}  → フッタは ${er.bottom > visBottom + 1 ? '★隠れる★' : '見える'}`,
    `イベント数 vvResize=${counts.vvResize} vvScroll=${counts.vvScroll} winScroll=${counts.winScroll} resizeObs=${counts.ro}`,
    `document.activeElement=<${document.activeElement?.tagName.toLowerCase()}>  shadowRoot.activeElement=<${shadowActive?.tagName.toLowerCase() ?? 'null'}>`,
    `上流 F6()（＝eHagaki 自身のキーボード補正が効くか）= ${f6()}`,
  ].join('\n');
}

const vv = window.visualViewport;
vv?.addEventListener('resize', () => { counts.vvResize++; apply(); });
vv?.addEventListener('scroll', () => { counts.vvScroll++; apply(); });
window.addEventListener('scroll', () => { counts.winScroll++; apply(); }, { passive: true });
new ResizeObserver(() => { counts.ro++; apply(); }).observe(host);
document.addEventListener('focusin', apply);
document.addEventListener('focusout', apply);
setInterval(apply, 500);   // イベントが来ない可能性そのものを疑うので、時間でも更新する

for (const b of document.querySelectorAll('#modes button')) {
  b.addEventListener('click', () => {
    mode = b.dataset.mode;
    for (const o of document.querySelectorAll('#modes button')) o.setAttribute('aria-pressed', String(o === b));
    el.style.cssText = '';
    apply();
  });
}
apply();
</script>
</body>
</html>
